<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>نظام الأصباغ — صافي الربح</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#0b111d;--card:#141c2b;--line:#22304a;--txt:#e8eef7;--mut:#8fa3bf;--acc:#38bdf8;--ok:#34d399;--bad:#f87171;--gold:#fbbf24}
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Tahoma;margin:0}
body{background:linear-gradient(180deg,#0b111d,#0d1526 60%,#0b111d);color:var(--txt);padding:14px;min-height:100vh}
.app{max-width:640px;margin:auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.logo i{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,#38bdf8,#22c55e);display:block;box-shadow:0 6px 18px #22c55e33}
.ver{background:#182236;border:1px solid var(--line);color:var(--ok);padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 10px 30px #0006}
.card h2{font-size:14px;color:var(--mut);font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.tag{font-size:10px;color:var(--mut)}
.flist{display:flex;flex-direction:column;gap:8px}
.fchip{display:flex;justify-content:space-between;align-items:center;background:#182236;border:1px solid #2a3a55;border-radius:14px;padding:11px 12px;font-size:13px}
.fchip.local{border-color:#34d39955}
.fbtns{display:flex;gap:6px}
.mini{border:0;border-radius:10px;padding:7px 12px;font-size:11px;font-weight:800;cursor:pointer}
.mini.open{background:var(--acc);color:#06121f}
.mini.rf{background:#24344f;color:var(--txt)}
.mini.rn{background:#24344f;color:var(--txt)}
.savebtn{width:100%;border:0;border-radius:14px;padding:12px;font-size:14px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#201404;margin-top:10px;box-shadow:0 8px 20px #f59e0b33}
.seg{display:flex;background:#0d1420;border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);padding:10px 4px;border-radius:11px;font-weight:800;font-size:12px;min-width:70px}
.seg button.on{background:linear-gradient(135deg,#38bdf8,#22c55e);color:#06121f}
.dates{display:none;gap:8px;margin-top:10px;align-items:center;font-size:12px;color:var(--mut)}
.dates.show{display:flex}
input[type=date]{flex:1;background:#0d1420;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:9px;font-size:12px}
.hero{background:linear-gradient(160deg,#0ea5e922,#22c55e22),var(--card);border:1px solid #22c55e44;border-radius:22px;padding:20px;text-align:center}
.hero .lbl{font-size:12px;color:var(--mut);font-weight:700}
.hero .net{font-size:30px;font-weight:900;color:var(--ok);direction:ltr;margin:6px 0}
.hero .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.chip{background:#0d1420;border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:11px;color:var(--mut)}
.chip b{color:var(--txt);direction:ltr;display:block;font-size:12px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:10px 6px;border-bottom:1px dashed #22304a;font-size:13px}
.srow.click{cursor:pointer}
.srow.click:active{background:#182236}
.srow .v{font-weight:800;direction:ltr}
.srow .n{color:var(--mut);font-size:10px;margin-left:6px}
.sub{border-radius:12px;margin:6px 0;border-bottom:0;padding:11px 10px}
.sub-y{background:#78350f33;border:1px solid #fbbf2433}
.sub-b{background:#1e40af22;border:1px solid #38bdf833}
.sub-g{background:#14532d33;border:1px solid #34d39933}
.sub-p{background:#7f1d1d33;border:1px solid #f8717133}
.sub .v{font-size:14px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--mut);font-size:12px;font-weight:800;padding:8px;border-radius:10px;background:#0d1420;border:1px solid var(--line)}
.ratios{display:flex;gap:8px;margin-top:12px}
.ratio{flex:1;background:#0d1420;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.ratio b{display:block;font-size:16px;color:var(--acc);direction:ltr}
.ratio span{font-size:10px;color:var(--mut)}
.bigbtn{width:100%;border:0;border-radius:16px;padding:14px;font-size:14px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#38bdf8,#22c55e);color:#06121f;box-shadow:0 10px 24px #22c55e33}
#modal{position:fixed;inset:0;background:#000c;display:none;padding:12px;overflow:auto;z-index:9}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;max-width:640px;margin:auto}
.x{float:left;background:var(--bad);border:0;border-radius:10px;padding:7px 14px;color:#fff;font-weight:800}
.vrow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 6px;border-bottom:1px dashed #22304a;font-size:12px}
.vrow .st{font-size:14px}
.vrow .vals{direction:ltr;color:var(--mut);font-size:10px;text-align:left}
.okc{color:var(--ok)}.badc{color:var(--bad)}
#err{background:#7f1d1d;border-radius:12px;padding:10px;display:none;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{border:1px solid #334155;padding:5px;text-align:right;white-space:nowrap}
th{background:#334155}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="logo"><i></i> نظام الأصباغ</div>
 <span class="ver" id="ver"></span>
</header>

<div class="card">
 <h2>📁 الملفات
  <span style="display:flex;gap:6px">
   <button class="mini rf" onclick="openSaved()">🗂 المحفوظة</button>
   <button class="mini rf" onclick="refreshList()">🔄 تحديث</button>
  </span>
 </h2>
 <div class="flist" id="localFiles"></div>
 <div class="flist" id="gitFiles" style="margin-top:8px"></div>
 <button class="savebtn" onclick="saveLocalActive()">💾 Save</button>
 <div class="tag" id="fs" style="margin-top:8px"></div>
</div>

<div class="card">
 <h2>🗓️ الفترة — الفئات تعمل بكل الأوضاع</h2>
 <div class="seg">
  <button class="on" onclick="modeAll(this)">الكل</button>
  <button onclick="modeYear(this)">📆 سنة</button>
  <button onclick="modeDay(this)">📅 يوم محدد</button>
  <button onclick="modeRange(this)">⇄ بين فترتين</button>
 </div>
 <div class="dates" id="dayBox">اليوم <input type="date" id="dDay" onchange="applyDay()"></div>
 <div class="dates" id="rangeBox">من <input type="date" id="d1" onchange="applyRange()"> إلى <input type="date" id="d2" onchange="applyRange()"></div>
 <div class="tag" id="plabel" style="margin-top:8px"></div>
</div>

<div id="err"></div>
<div id="out"></div>
</div>

<div id="modal"><div class="box">
<button class="x" onclick="closeM()">✕</button>
<h2 id="mtitle" style="margin:6px 0 12px;font-size:15px"></h2>
<div id="mbody"></div>
</div></div>

<script>
/* ====== v32: زر تحميل الملف المحفوظ محليًا ====== */
const VERSION='v32';
document.getElementById('ver').textContent=VERSION;
const REPO='ahmedbrzan/asbakk';
const API='https://api.github.com/repos/'+REPO+'/contents/';
let ACTIVE=null,FILES=[],R={},P={start:null,end:null},CUR_MOVES=[];

/* ===== أدوات ===== */
const ARD='٠١٢٣٤٥٦٧٨٩';
function norm(s){return String(s).replace(/[٠-٩]/g,d=>ARD.indexOf(d)).replace(/،/g,',').replace(/٫/g,'.').replace(/[\u200f\u200e]/g,'');}
const num=v=>{if(typeof v==='number')return v;if(v==null)return null;
 const n=parseFloat(norm(v).replace(/[,\s]/g,''));return isNaN(n)?null:n;};
const fmt=n=>n==null?'—':n.toLocaleString('en-US',{maximumFractionDigits:2});
const pct=n=>n==null?'—':(n*100).toFixed(1)+'%';
function toDate(v){if(v==null||v==='')return null;if(v instanceof Date)return v;
 if(typeof v==='number'&&v>20000&&v<80000)return new Date(Math.round((v-25569)*86400000));
 const s=norm(v).trim();let m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
 if(m)return new Date(+m[1],+m[2]-1,+m[3]);
 m=s.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);
 m=s.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);
 const d=new Date(s);return isNaN(d)?null:d;}
const ci=(H,ks)=>H.findIndex(h=>ks.some(k=>String(h).includes(k)));
const isSkipType=ty=>{const s=String(ty||'');return s.includes('إغلاق')||s.includes('تسوية');};
function dayOf(d){return d?new Date(d.getFullYear(),d.getMonth(),d.getDate()):null;}
function inP(d){if(!P.start||!P.end)return true;if(!d)return false;const x=dayOf(d);return x>=P.start&&x<=P.end;}
function belongMonth(r,H,fd){
 const bi=ci(H,['البيان']);
 const s=bi>=0?norm(String(r[bi]||'')):'';
 let m=s.match(/ولغاي[ةه]\s*(\d{1,2})\/(\d{1,2})/);
 if(m)return +m[1];
 m=s.match(/شهر\s*(\d{1,2})/);
 if(m)return +m[1];
 m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
 if(m)return +m[2];
 return fd?fd.getMonth()+1:null;}
function filtered32(t){
 if(!t)return[];
 if(!P.start)return t.data;
 const di=t.di;
 if(P.start.getTime()===P.end.getTime())return t.data.filter(r=>inP(toDate(r[di])));
 const sm=P.start.getMonth()+1,em=P.end.getMonth()+1;
 return t.data.filter(r=>{
  const fd=toDate(r[di]);
  const bm=belongMonth(r,t.headers,fd);
  if(bm==null)return fd&&inP(fd);
  return bm>=sm&&bm<=em;});}

/* ===== فئات سراج ===== */
const CATS=[
 {code:'32201',name:'ايجار بنايلة',kw:['ايجار بنا','اجار بنا','ايجار البنا','استحقاق ايجار','استحقاق شهر']},
 {code:'32202',name:'كهرباء',kw:['كهرباء','كهربا']},
 {code:'32205',name:'اشتراك مولد',kw:['اشتراك مولد','مولد']},
 {code:'32207',name:'شراء ماء للمحل',kw:['ماء للمحل','قناني','مياه','ابي ماء']},
 {code:'32208',name:'شراء قرطاسية متنوعة',kw:['قرطاسية','طباعة','ورق']},
 {code:'32209',name:'شراء منظفات',kw:['منظفات','معطر','صابون','تنظيف']},
 {code:'32210',name:'شراء علاليك',kw:['علايك','علاليك','اكياس']},
 {code:'32212',name:'مكافئات تشجيعية',kw:['مكافاة','مكافئات','مكافئه']},
 {code:'32213',name:'اجور نقل',kw:['اجور نقل','نقل','محروس','ابو اثير']},
 {code:'32214',name:'مشروبات ساخنة',kw:['مشروبات','شاي','قهوة','عصير']},
 {code:'32215',name:'صيانة',kw:['صيانة','تصليح','تصليحات']},
 {code:'32216',name:'اعانة محتاجين',kw:['اعانة','محتاجين','تبرع','صدقة']},
 {code:'32217',name:'عمولة حوالات الشركات',kw:['عمولة','حوالات']},
 {code:'32218',name:'زيادة ونقص صندوق',kw:['زيادة ونقص','نقص صندوق','فرق صندوق']},
 {code:'32223',name:'طعام موظفين',kw:['طعام','غداء','فطور','مطعم','اكل']},
 {code:'32224',name:'مصاريف تسويق وتطوير',kw:['تسويق','تطوير','اعلان','دعاية','لوحة']},
 {code:'32228',name:'اجور توصيل بضاعة',kw:['توصيل بضاعة','توصيل']},
 {code:'32231',name:'اعلام ونشر الشركة',kw:['اعلام','نشر','سوشيال','فيسبوك']},
 {code:'32211',name:'مشتريات المحل',kw:['مشتريات المحل','شراء','اثاث','رفوف']},
 {code:'32206',name:'مصاريف مختلفة',kw:['مختلفة','متفرقة','بدون بيان','سحب','كابز','لابتوب','لا بتوب']},
 {code:'32219',name:'اجور الموظفين',kw:['اجور','راتب','رواتب','استحقاق']}
];
function classifyExp(stmt){
 const s=norm(stmt||'');
 for(const c of CATS){for(const k of c.kw){if(s.includes(norm(k)))return c;}}
 return null;}

/* ===== حفظ محلي + تحميل ===== */
let db=null;
function idb(){return new Promise((res,rej)=>{const q=indexedDB.open('asbag-save',1);
 q.onupgradeneeded=e=>{e.target.result.createObjectStore('save',{keyPath:'name'});};
 q.onsuccess=e=>{db=e.target.result;res();};q.onerror=()=>rej(q.error);});}
function putLocal(name,blob){return new Promise((res,rej)=>{const tx=db.transaction('save','readwrite');
 tx.objectStore('save').put({name,blob,ts:Date.now()});tx.oncomplete=res;tx.onerror=rej;});}
function getLocal(name){return new Promise((res,rej)=>{const tx=db.transaction('save','readonly');
 const q=tx.objectStore('save').get(name);q.onsuccess=()=>res(q.result);q.onerror=rej;});}
function allLocal(){return new Promise((res,rej)=>{const tx=db.transaction('save','readonly');
 const q=tx.objectStore('save').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=rej;});}
function delRec(name){return new Promise((res,rej)=>{const tx=db.transaction('save','readwrite');
 tx.objectStore('save').delete(name);tx.oncomplete=res;tx.onerror=rej;});}
function setStatus(m){document.getElementById('fs').innerHTML=m;}
const cleanName=n=>n.replace(/\.(xlsx|xls)$/i,'');
/* ✅ v32: تنزيل الملف المحفوظ للهاتف */
async function downloadLocal(name){
 const rec=await getLocal(name);if(!rec||!rec.blob)return;
 const url=URL.createObjectURL(rec.blob);
 const a=document.createElement('a');
 a.href=url;a.download=name;
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),3000);
 setStatus('⬇ تم تنزيل: '+cleanName(name));}
async function renderLocal(){
 const list=(await allLocal()).sort((a,b)=>(b.ts||0)-(a.ts||0));
 document.getElementById('localFiles').innerHTML=list.map(r=>
  `<div class="fchip local"><b>📍 ${cleanName(r.name)} <span class="tag">(محلي)</span></b>
   <span class="fbtns">
    <button class="mini open" onclick="openLocal('${r.name.replace(/'/g,"\\'")}')">فتح</button>
    <button class="mini rn" onclick="downloadLocal('${r.name.replace(/'/g,"\\'")}')">⬇</button>
   </span></div>`).join('')||'';}
async function openLocal(name){
 const rec=await getLocal(name);if(!rec)return;
 ACTIVE={name:rec.name,blob:rec.blob};
 localStorage.setItem('asbag-last',name);
 ingestBuffer(await rec.blob.arrayBuffer(),cleanName(name)+' (محلي)');
 setStatus('📍 محمّل من الحفظ المحلي: '+cleanName(name));
 closeM();}
async function saveLocalActive(){
 if(!ACTIVE||!ACTIVE.blob){setStatus('⚠️ افتح ملفًا أولًا ثم اضغط Save');return;}
 await putLocal(ACTIVE.name,ACTIVE.blob);
 localStorage.setItem('asbag-last',ACTIVE.name);
 renderLocal();
 setStatus('✅ Saved locally: '+cleanName(ACTIVE.name));}
async function openSaved(){
 const list=(await allLocal()).sort((a,b)=>(b.ts||0)-(a.ts||0));
 document.getElementById('mtitle').textContent='🗂 الملفات المحفوظة محليًا';
 document.getElementById('mbody').innerHTML=list.map(r=>
  `<div class="vrow"><span>📍 ${cleanName(r.name)}</span>
   <span style="display:flex;gap:6px">
    <button class="mini open" onclick="openLocal('${r.name.replace(/'/g,"\\'")}')">فتح</button>
    <button class="mini rn" onclick="downloadLocal('${r.name.replace(/'/g,"\\'")}')">⬇</button>
    <button class="mini rn" onclick="renameSaved('${r.name.replace(/'/g,"\\'")}')">✏️</button>
    <button class="mini rn" style="background:#7f1d1d;color:#fff" onclick="delSaved('${r.name.replace(/'/g,"\\'")}')">🗑</button>
   </span></div>`).join('')||'<div class="tag">لا ملفات محفوظة بعد</div>';
 document.getElementById('modal').style.display='block';}
async function renameSaved(name){
 const n=prompt('الاسم الجديد:',cleanName(name));if(!n)return;
 const rec=await getLocal(name);if(!rec)return;
 const newName=n+'.xlsx';
 await putLocal(newName,rec.blob);await delRec(name);
 if(localStorage.getItem('asbag-last')===name)localStorage.setItem('asbag-last',newName);
 renderLocal();openSaved();}
async function delSaved(name){
 if(!confirm('حذف «'+cleanName(name)+'»؟'))return;
 await delRec(name);
 if(localStorage.getItem('asbag-last')===name)localStorage.removeItem('asbag-last');
 renderLocal();openSaved();}
async function refreshList(){
 setStatus('⏳ جلب القائمة من GitHub...');
 try{
  const res=await fetch(API+'?t='+Date.now());
  if(!res.ok)throw new Error('HTTP '+res.status);
  FILES=(await res.json()).filter(x=>/\.(xlsx|xls)$/i.test(x.name));
  const saved=new Set((await allLocal()).map(r=>r.name));
  document.getElementById('gitFiles').innerHTML=FILES.map((f,i)=>
   `<div class="fchip"><b>📄 ${cleanName(f.name)} ${saved.has(f.name)?'<span class="tag">📍 محفوظ</span>':''}</b>
    <span class="fbtns"><button class="mini open" onclick="openGit(${i})">فتح</button></span></div>`).join('')
   ||'<span class="tag">لا ملفات Excel بالمستودع</span>';
  setStatus('✅ القائمة جاهزة');
 }catch(e){setStatus('⚠️ تعذر جلب القائمة ('+e.message+')');}
}
async function openGit(i){
 const f=FILES[i];if(!f)return;
 setStatus('⏳ تحميل '+f.name+'...');
 try{
  const r=await fetch(f.download_url);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const blob=await r.blob();
  ACTIVE={name:f.name,blob};
  localStorage.setItem('asbag-last',f.name);
  ingestBuffer(await blob.arrayBuffer(),cleanName(f.name));
  setStatus('✅ فُتح من GitHub — اضغط 💾 Save');
 }catch(e){setStatus('⚠️ فشل: '+e.message);}
}

/* ===== الفلتر ===== */
function sel(b){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');}
function modeAll(b){sel(b);dayBox.classList.remove('show');rangeBox.classList.remove('show');P={start:null,end:null};safeRender();}
function modeYear(b){sel(b);dayBox.classList.remove('show');rangeBox.classList.remove('show');
 const mx=maxDate();const y=mx?mx.getFullYear():2026;
 P={start:new Date(y,0,1),end:new Date(y,11,31)};safeRender();}
function modeDay(b){sel(b);dayBox.classList.add('show');rangeBox.classList.remove('show');
 if(!dDay.value){const mx=maxDate();if(mx)dDay.value=mx.toISOString().slice(0,10);}applyDay();}
function applyDay(){const d=toDate(dDay.value);if(!d)return;P={start:d,end:d};safeRender();}
function modeRange(b){sel(b);rangeBox.classList.add('show');dayBox.classList.remove('show');applyRange();}
function applyRange(){const a=toDate(d1.value),b2=toDate(d2.value);if(!a||!b2)return;P={start:a,end:b2};safeRender();}
function periodLabel(){
 if(!P.start)return 'كامل المدة';
 if(P.start.getTime()===P.end.getTime())return 'اليوم: '+P.start.toLocaleDateString('en-GB');
 if(P.start.getMonth()===0&&P.end.getMonth()===11&&P.end.getDate()===31)return 'سنة '+P.start.getFullYear();
 return 'الفترة: '+P.start.toLocaleDateString('en-GB')+' → '+P.end.toLocaleDateString('en-GB');}
function filtered(t){if(!t)return[];if(t.di==null||t.di<0)return t.data;
 return t.data.filter(r=>inP(toDate(r[t.di])));}
function maxDate(){let mx=null;const scan=t=>{if(!t||t.di<0)return;
 t.data.forEach(r=>{const dt=toDate(r[t.di]);if(dt&&(!mx||dt>mx))mx=dt;});};
 if(R.ledgers)Object.values(R.ledgers).forEach(scan);
 [R.sales,R.disc,R.journal,R.dj,R.inv].forEach(scan);return mx;}
function safeRender(){try{render();}catch(e){showErr('فشل العرض: '+e.message);}}

/* ===== قارئ الدفاتر ===== */
function findHeader(g){
 let best=-1,bestScore=0;
 for(let i=0;i<Math.min(g.length,15);i++){
  const row=(g[i]||[]).map(v=>v==null?'':String(v).trim());
  let score=0;
  row.forEach(v=>{

const COLK=['النوع','التاريخ','القيمة','اسم الحساب','مدين','دائن','رقم السند','المبلغ','البيان','الرصيد','الموضوع','نسبة','حسم','الكمية','الوحدة','المادة','رقم الفاتورة','الحساب','تكلفة','الربح','قيمة المبيع','السعر الاجمالي','السعر النهائي','اسم العميل','مجموع الفاتورة','اجمالي الفاتورة','هدايا','ملاحظة','رمز الحساب','الاجمالي','الصافي','طريقة الدفع','العميل','الحساب المقابل','المرسل','الوقت','الدفعات','الباقي','المستودع','اجمالي جزئي','اجمالي كلي'];
const TK=['كشف حساب','حركة المبيعات','الحركة المالية','قائمة الدخل','صافي الدخل','نسب الأرباح','حسم ممنوح','متاجره','متاجرة','الخسائر','أرباح المواد','ارباح المواد','ميزان المراجعة','الميزانية العمومية','دفتر اليومية','فواتير مبيعات'];
function colBlocks(g){const W=g.reduce((m,r)=>Math.max(m,r.length),0);const act=new Array(W).fill(false);
 for(const r of g)for(let c=0;c<W;c++)if(r[c]!=null&&String(r[c]).trim()!=='')act[c]=true;
 const res=[];let s=-1;
 for(let c=0;c<=W;c++){if(c<W&&act[c]){if(s<0)s=c;}else if(s>=0){if(c-s>=2)res.push([s,c]);s=-1;}}
 return res;}
function extractBlockTables(g,s,e){
 let h=-1;
 for(let i=0;i<Math.min(g.length,60);i++){let kw=0,idx=false;
  for(let c=s;c<e;c++){const v=g[i][c];if(v==null)continue;const t=String(v).trim();
   if(IDX.includes(t))idx=true;if(COLK.some(k=>t.includes(k)))kw++;}
  if(kw>=2||(idx&&kw>=1)){h=i;break;}}
 if(h<0)return[];
 const cells=[];for(let c=s;c<e;c++)if(g[h][c]!=null&&String(g[h][c]).trim()!=='')cells.push(c);
 if(!cells.length)return[];
 const segs=[];let cur=[cells[0]];
 for(let i=1;i<cells.length;i++){if(cells[i]-cells[i-1]>1){segs.push(cur);cur=[cells[i]];}else cur.push(cells[i]);}
 segs.push(cur);
 const out=[];
 for(const cols of segs){if(cols.length<2)continue;
  const headers=cols.map(c=>String(g[h][c]).trim());
  let title='';
  for(let i=0;i<h&&!title;i++)for(let c=cols[0];c<=cols[cols.length-1];c++){const v=g[i][c];
   if(v!=null&&TK.some(k=>String(v).includes(k))){title=String(v);break;}}
  const data=[];let blank=0;
  for(let i=h+1;i<g.length;i++){const row=g[i]||[];const vals=cols.map(c=>row[c]??null);
   if(vals.every(v=>v==null||String(v).trim()==='')){blank++;if(blank>=2)break;continue;}
   blank=0;
   if(vals.some(v=>v!=null&&String(v).includes('مجموع')))break;
   data.push(vals);}
  if(data.length)out.push({headers,data,title,di:ci(headers,['تاريخ'])});}
 return out;}
function classify(t){

 if(T.includes('فواتير المبيعات')||T.includes('فواتير مبيعات'))return 'inv';
 if(T.includes('أرباح المواد')||T.includes('ارباح المواد')){
  if(/ونقدي|نقدي واجل|اجل ونقدي/.test(T))return 'ipBoth';
  if(T.includes('نقدي فقط'))return 'ipCash';
  if(/الاجل|أجل/.test(T))return 'ipCredit';
  return 'ipBoth';}
 if(T.includes('ميزان المراجعة'))return 'tb';
 if(T.includes('الميزانية العمومية'))return 'bs';
 if(T.includes('دفتر اليومية'))return 'dj';

  const ai=ci(H,['اسم الحساب']);

 if(has('الموضوع')&&has('نسبة'))return 'rat';
 if(has('مدين')&&has('الحساب'))return 'pl';
 if(has('التاريخ')&&has('القيمة'))return 'sales';
 return null;}

function computeIncome(){
 const pl=plVals();
 if(R.ledgers&&R.ledgers['41101']){
  const wf=!!P.start;
  const sales=(sheetValue('41101',wf)||{}).net;
  const ret=(sheetValue('41102',wf)||{}).net;
  const granted=(sheetValue('41103',wf)||{}).net;
  const cogs=(sheetValue('31105',wf)||{}).net;
  const earned=0;
  const expList=expByCats();
  const exp=expList.reduce((s,x)=>s+(x.val||0),0);
  const netSales=(sales||0)-(ret||0)-(granted||0),costSales=cogs||0,gross=netSales-costSales,net=gross-exp;
  return{sales:sales||0,ret:ret||0,granted:granted||0,earned,cogs:costSales,exp,netSales,costSales,gross,net,expList,filtered:wf,ledger:true};
 }
 if(P.start){
  const E=periodEngine();const ip=ipAgg();
  const sales=E.sales||ip.grossSale;
  const granted=discParse('grant',true).total||E.granted;
  const ret=E.ret;
  const cogs=E.cogs||ip.cost;
  const exp=E.exp;
  const netSales=sales-ret-granted,costSales=cogs,gross=netSales-costSales,net=gross-exp;
  return{sales,ret,granted,earned:0,cogs,exp,netSales,costSales,gross,net,expList:E.expList,filtered:true,ledger:false};
 }
 const mt=mutaj(),m=R.m||{};
 const sales=mt.sales??m['المبيعات']??0,ret=mt.returns??m['مردودات المبيعات']??0,
  cogs=mt.cogs??m['تكلفة البضاعة المباعة']??0,
  granted=R.disc?discParse('grant').total:(m['الحسم الممنوح']||0),
  exp=pl?(pl.exp32??pl.expenses.reduce((s,x)=>s+x.val,0)):(m['مجموع المصاريف']||0);
 const netSales=sales-ret-granted,costSales=cogs,gross=netSales-costSales,net=gross-exp;
 return{sales,ret,granted,earned:0,cogs,exp,netSales,costSales,gross,net,

function periodEngine(){

 const A=acctSums(R.dj,en),B=acctSums(R.journal,en);
 const pick=k=>A[k]?A[k]:(B[k]?B[k]:0);
 const src=A.exp?A:(B.exp?B:null);
 return{sales:pick('sales'),ret:pick('ret'),granted:pick('granted'),
  cogs:pick('cogs'),exp:pick('exp'),expList:src?src.expList:[]};}
function acctSums(t,expNames){
 const out={sales:0,ret:0,granted:0,cogs:0,expMap:{},exp:0,expList:[]};
 if(!t)return out;
 const H=t.headers,codeI=ci(H,['رمز الحساب']),n1=ci(H,['اسم الحساب']),n2=ci(H,['الحساب']),mi=ci(H,['مدين']),cri=ci(H,['دائن']),di=ci(H,['تاريخ']),ti=ci(H,['النوع']);
 if(mi<0||cri<0)return out;
 t.data.forEach(r=>{
  if(di>=0&&!inP(toDate(r[di])))return;
  if(ti>=0&&isSkipType(r[ti]))return;
  const code=String(codeI>=0?r[codeI]:'').trim();
  const nm=(n1>=0?String(r[n1]??''):'')+'|'+(n2>=0?String(r[n2]??''):'');
  const d=num(r[mi])||0,c=num(r[cri])||0;if(!d&&!c)return;
  const has=p=>(code&&code.startsWith(p))||nm.includes('- '+p)||nm.includes(p+' -')||nm.includes('|'+p)||nm.includes(p+'|');
  if(has('41102')||nm.includes('مردودات')){out.ret+=d-c;return;}
  if(has('41103')||nm.includes('الحسم الممنوح')){out.granted+=d-c;return;}
  if(has('31105')||nm.includes('تكلفة البضاعة')){out.cogs+=d-c;return;}
  if(has('41101')||nm.includes('المبيعات')){out.sales+=c-d;return;}
  if(code.startsWith('322')||nm.includes('322')||(expNames&&expNames.some(n=>n&&n.length>3&&nm.includes(n)))){
   const clean=String(n1>=0?r[n1]??'':code).replace(/\s*-\s*\d+.*$/,'').trim()||code;
   out.expMap[clean]=(out.expMap[clean]||0)+(d-c);}});
 out.expList=Object.entries(out.expMap).map(([name,val])=>({code:'',name,val}));
 out.exp=out.expList.reduce((s,x)=>s+x.val,0);
 return out;}

 let h=`<div class="hero"><div class="lbl">صافي الربح — ${periodLabel()}${ACTIVE&&ACTIVE.label?' · '+ACTIVE.label:''}</div>

 h+=row('المبيعات',fmt(ic.sales),'',1);

  </div>
  <button class="bigbtn" style="margin-top:14px" onclick="openVerify()">🔍 التدقيق العميق</button></div>`;
 o.innerHTML=h;
 document.getElementById('plabel').textContent=periodLabel();

/* ===== التدقيق ===== */
const st=(a,b)=>{if(a==null||b==null)return['—',''];
 if(Math.abs(a-b)<1)return['✅','okc'];return['❌','badc'];};
function vrow(l,a,b){const[s,c]=st(a,b);
 return`<div class="vrow"><span>${l}</span><span><span class="vals">${fmt(a)} ↔ ${fmt(b)}</span> <span class="st ${c}">${s}</span></span></div>`;}
function openVerify(){
 const ic=computeIncome();const wf=!!P.start;
 const mt=mutaj();const tb=tbVals();const pl=plVals();const ip=ipAgg();
 const inv=invSums(wf);
 const m=R.m||{};
 let x='';
 x+=vrow('المبيعات = المتاجرة (411)',ic.sales,mt.sales||null);
 x+=vrow('المبيعات = قائمة الدخل',ic.sales,m['المبيعات']||null);
 x+=vrow('المبيعات = بحث الفواتير (الاجمالي)',ic.sales,inv?inv.total:null);
 x+=vrow('المبيعات = ورقة٤',ic.sales,ip.grossSale||null);
 x+=vrow('المردودات = المتاجرة 41102',ic.ret,mt.returns||null);
 x+=vrow('الممنوح = المتاجرة 41103',ic.granted,mt.granted||null);
 x+=vrow('صافي المبيعات = المتاجرة الموارد',ic.netSales,mt.netSales||null);
 x+=vrow('صافي المبيعات = بحث الفواتير (الصافي)',ic.netSales,inv?inv.net:null);
 x+=vrow('التكلفة = المتاجرة 31105',ic.costSales,mt.cogs||null);
 x+=vrow('التكلفة = ورقة٤',ic.costSales,ip.cost||null);
 if(wf)x+=vrow('مصاريف بالاستحقاق ↔ مدفوعة بالتاريخ',ic.exp,expPaid());
 x+=vrow('المصاريف = الأرباح والخسائر 32',ic.exp,pl?pl.exp32:null);
 x+=vrow('مجمل الدخل = المتاجرة 92',ic.gross,pl?pl.gross:null);
 x+=vrow('مجمل الدخل = ورقة٤ الربح',ic.gross,ip.prof||null);
 x+=vrow('توازن الميزان',tb?tb.totD:null,tb?tb.totC:null);
 x+=vrow('صافي الدخل = المجمل − المصاريف',ic.net,(ic.gross||0)-(ic.exp||0));
 document.getElementById('mtitle').textContent='🔍 التدقيق العميق — '+periodLabel();
 document.getElementById('mbody').innerHTML=x;
 document.getElementById('modal').style.display='block';
}
