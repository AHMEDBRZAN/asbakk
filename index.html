<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام شركة الأصباغ</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--acc:#38bdf8;--ok:#4ade80;--bad:#f87171;--txt:#e2e8f0}
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Tahoma}
body{background:var(--bg);color:var(--txt);margin:0;padding:14px}
h1{font-size:19px;text-align:center}
.ver{background:#334155;color:var(--ok);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border-radius:14px;padding:14px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid #334155;font-size:13px}
.row b{direction:ltr}
.btn{display:block;width:100%;margin-top:10px;background:var(--acc);border:0;color:#0f172a;font-weight:700;padding:9px;border-radius:10px;font-size:13px}
.btn.w{background:#f59e0b}.btn.g{background:var(--ok)}.btn.r{background:var(--bad);color:#fff}
.ok{color:var(--ok)}.bad{color:var(--bad)}
input[type=file]{color:var(--txt);font-size:12px;width:100%}
input[type=date],input[type=text]{background:#334155;border:0;color:var(--txt);border-radius:8px;padding:7px}
.pb{background:#334155;border:0;color:var(--txt);border-radius:8px;padding:6px 10px;margin:2px;font-weight:700;font-size:12px}
.pb.on{background:var(--acc);color:#0f172a}
.hero{background:linear-gradient(135deg,#0ea5e9,#22c55e);border-radius:14px;padding:16px;text-align:center;margin:12px 0}
.hero b{font-size:24px;display:block}
#modal{position:fixed;inset:0;background:#000c;display:none;padding:12px;overflow:auto;z-index:9}
#modal .box{background:var(--card);border-radius:14px;padding:12px;max-width:1100px;margin:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{border:1px solid #334155;padding:5px;text-align:right;white-space:nowrap}
th{background:#334155}
.x{float:left;background:var(--bad);border:0;border-radius:8px;padding:6px 12px;color:#fff;font-weight:700}
#err{background:#7f1d1d;border-radius:10px;padding:10px;margin:10px 0;display:none}
.tag{font-size:11px;color:#94a3b8}
section{margin:14px 0}
.incwrap{display:flex;gap:14px;flex-wrap:wrap}
.incwrap>div:first-child{flex:2;min-width:300px}
.incwrap>div:last-child{flex:1;min-width:250px}
.r-y{background:#78350f55}.r-b{background:#1e40af44}.r-g{background:#14532d66}.r-p{background:#7f1d1d55}
</style>
</head>
<body>
<h1>🎨 نظام شركة الأصباغ <span class="ver" id="ver"></span></h1>

<section class="card">
<h2>📁 ملفات التقرير على GitHub <button class="pb" onclick="loadRepoList()">🔄 تحقق</button></h2>
<div id="files"></div>
<div id="fs" class="tag"></div>
</section>

<section class="card">
<h2>🗓️ الفترة</h2>
<button class="pb on" onclick="modeAll(this)">الكل</button>
<button class="pb" onclick="modeDay(this)">📅 يوم محدد</button>
<button class="pb" onclick="modeRange(this)">📆 بين فترتين</button>
<div id="dayBox" style="display:none;margin-top:8px">اليوم: <input type="date" id="dDay" onchange="applyDay()"></div>
<div id="rangeBox" style="display:none;margin-top:8px">من: <input type="date" id="d1" onchange="applyRange()"> إلى: <input type="date" id="d2" onchange="applyRange()"></div>
<div id="plabel" class="tag"></div>
</section>

<section class="card">
<h2>📤 رفع يدوي (احتياطي)</h2>
<input type="file" id="fMonthly" accept=".xlsx,.xls">
<div id="pm" class="tag"></div>
</section>

<div id="err"></div>
<div id="out"></div>

<div id="modal"><div class="box">
<button class="x" onclick="closeM()">✕ إغلاق</button>
<h2 id="mtitle"></h2>
<div id="mbody" style="overflow:auto;max-height:78vh"></div>
</div></div>

<script>
/* 🔖 الإصدار */
const VERSION='v9';
document.getElementById('ver').textContent='الإصدار '+VERSION;
const REPO='ahmedbrzan/asbakk';
let ACTIVE='';let FILES=[];

/* ===== 📁 قائمة GitHub ===== */
function setStatus(m){document.getElementById('fs').innerHTML=m;}
function namesMap(){try{return JSON.parse(localStorage.getItem('asbag-names')||'{}')}catch(e){return{}}}
async function loadRepoList(){
 setStatus('⏳ فحص الملفات على GitHub...');
 try{
  const res=await fetch('https://api.github.com/repos/'+REPO+'/contents/?t='+Date.now());
  if(!res.ok)throw new Error('HTTP '+res.status);
  const items=await res.json();
  FILES=items.filter(x=>/\.(xlsx|xls)$/i.test(x.name));
  renderFiles();
  setStatus('✅ تم الفحص: '+FILES.length+' ملف — '+new Date().toLocaleTimeString('en-GB'));
  const last=localStorage.getItem('asbag-last');
  const i=FILES.findIndex(f=>f.name===last);
  if(i>=0)openFile(i);
 }catch(e){setStatus('⚠️ تعذر جلب القائمة: '+e.message);}
}
function renderFiles(){
 const nm=namesMap();let h='';
 FILES.forEach((f,i)=>{
  const label=nm[f.name]||f.name.replace(/\.(xlsx|xls)$/i,'');
  h+=`<div class="row"><span>📄 ${label} <span class="tag">(${(f.size/1024).toFixed(0)} KB)</span></span>
  <span style="white-space:nowrap">
   <button class="pb on" onclick="openFile(${i})">فتح</button>
   <button class="pb" onclick="renameFile(${i})">✏️ تسمية</button>
  </span></div>`;});
 document.getElementById('files').innerHTML=h||'<span class="tag">لا ملفات Excel بالمستودع</span>';}
async function openFile(i){
 const f=FILES[i];if(!f)return;
 setStatus('⏳ تحميل '+f.name+'...');
 try{
  const res=await fetch(f.download_url);
  ingestBuffer(await res.arrayBuffer(),namesMap()[f.name]||f.name.replace(/\.(xlsx|xls)$/i,''));
  localStorage.setItem('asbag-last',f.name);
  setStatus('✅ الملف النشط: '+f.name);
 }catch(e){setStatus('⚠️ فشل: '+e.message);}
}
function renameFile(i){
 const f=FILES[i];if(!f)return;
 const nm=namesMap();
 const n=prompt('الاسم المعروض داخل النظام:',nm[f.name]||f.name.replace(/\.(xlsx|xls)$/i,''));
 if(!n)return;
 nm[f.name]=n;localStorage.setItem('asbag-names',JSON.stringify(nm));
 renderFiles();}

/* ===== 🗓️ الفلتر ===== */
let P={start:null,end:null};
function sel(b){b.parentElement.querySelectorAll('.pb').forEach(x=>x.classList.remove('on'));b.classList.add('on');}
function modeAll(b){sel(b);dayBox.style.display='none';rangeBox.style.display='none';P={start:null,end:null};render();}
function modeDay(b){sel(b);dayBox.style.display='block';rangeBox.style.display='none';
 const el=document.getElementById('dDay');
 if(!el.value){const mx=maxDate();if(mx)el.value=mx.toISOString().slice(0,10);}
 applyDay();}
function applyDay(){const d=toDate(document.getElementById('dDay').value);if(!d)return;P={start:d,end:d};render();}
function modeRange(b){sel(b);dayBox.style.display='none';rangeBox.style.display='block';applyRange();}
function applyRange(){const a=toDate(d1.value),b=toDate(d2.value);if(!a||!b)return;P={start:a,end:b};render();}
function periodLabel(){return P.start?(P.start.getTime()===P.end.getTime()
 ?`اليوم: ${P.start.toLocaleDateString('en-GB')}`
 :`الفترة: ${P.start.toLocaleDateString('en-GB')} → ${P.end.toLocaleDateString('en-GB')}`)
 :'الفترة: كل الحركات (شهري)';}

/* ===== أدوات ===== */
const num=v=>{if(typeof v==='number')return v;if(v==null)return null;
 const s=String(v).replace(/[,\s]/g,'');const n=parseFloat(s);return isNaN(n)?null:n;};
const fmt=n=>n==null?'—':n.toLocaleString('en-US',{maximumFractionDigits:2});
const pct=n=>n==null?'—':(n*100).toFixed(1)+'%';
function toDate(v){if(v==null)return null;if(v instanceof Date)return v;
 if(typeof v==='number'&&v>20000&&v<80000)return new Date(Math.round((v-25569)*86400000));
 const s=String(v).trim();let m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
 if(m)return new Date(+m[1],+m[2]-1,+m[3]);
 m=s.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);
 const d=new Date(s);return isNaN(d)?null:d;}
const ci=(H,ks)=>H.findIndex(h=>ks.some(k=>String(h).includes(k)));
function codeMatch(c,pre){c=String(c).trim();if(c===pre)return true;
 return c.startsWith(pre)&&!'0123456789'.includes(c.charAt(pre.length));}

/* ===== محرك القراءة ===== */
const IDX=['#','ت','م'];
const COLK=['النوع','التاريخ','القيمة','اسم الحساب','مدين','دائن','وارد نقدي','وارد أجل','صادر نقدي','صادر أجل','رقم السند','المبلغ','البيان','الرصيد','الموضوع','نسبة','حسم','الكمية','الوحدة','المادة','رقم الفاتورة','الحساب','تكلفة','الربح','قيمة المبيع','السعر الاجمالي','السعر النهائي','اسم العميل','مجموع الفاتورة','اجمالي الفاتورة','هدايا','ملاحظة','رمز الحساب','رصيد حركة مدين','رصيد حركة دائن'];
function colBlocks(g){
 const W=g.reduce((m,r)=>Math.max(m,r.length),0);
 const act=new Array(W).fill(false);
 for(const r of g)for(let c=0;c<W;c++)if(r[c]!=null&&String(r[c]).trim()!=='')act[c]=true;
 const res=[];let s=-1;
 for(let c=0;c<=W;c++){
  if(c<W&&act[c]){if(s<0)s=c;}
  else if(s>=0){if(c-s>=2)res.push([s,c]);s=-1;}
 }
 return res;}
function blockTable(g,s,e){
 let h=-1,cols=[];
 for(let i=0;i<Math.min(g.length,60);i++){
  let kw=0,idx=false;
  for(let c=s;c<e;c++){const v=g[i][c];if(v==null)continue;const t=String(v).trim();
   if(IDX.includes(t))idx=true;if(COLK.some(k=>t.includes(k)))kw++;}
  if(kw>=2||(idx&&kw>=1)){h=i;for(let c=s;c<e;c++)if(g[i][c]!=null&&String(g[i][c]).trim()!=='')cols.push(c);break;}
 }
 if(h<0)return null;
 const headers=cols.map(c=>String(g[h][c]).trim());
 const TK=['كشف حساب','حركة المبيعات','الحركة المالية','قائمة الدخل','صافي الدخل','نسب الأرباح','حسم ممنوح','متاجره','الخسائر','أرباح المواد','ارباح المواد','ميزان المراجعة','الميزانية العمومية','دفتر اليومية'];
 let title='';
 for(let i=0;i<h&&!title;i++)for(let c=s;c<e;c++){const v=g[i][c];
  if(v!=null&&TK.some(k=>String(v).includes(k))){title=String(v);break;}}
 const data=[];let totals=null,blank=0;
 for(let i=h+1;i<g.length;i++){
  const row=g[i]||[];const vals=cols.map(c=>row[c]??null);
  if(vals.every(v=>v==null||String(v).trim()==='')){blank++;if(blank>=2)break;continue;}
  blank=0;
  if(vals.some(v=>v!=null&&String(v).includes('مجموع'))){totals=vals;break;}
  data.push(vals);}
 return{headers,data,totals,title};}
function classify(t){
 const H=t.headers;const has=k=>H.some(h=>String(h).includes(k));const T=t.title||'';
 if(T.includes('أرباح المواد')||T.includes('ارباح المواد')){
  if(/ونقدي|نقدي واجل|اجل ونقدي/.test(T))return 'ipBoth';
  if(T.includes('نقدي فقط'))return 'ipCash';
  if(/الاجل|أجل/.test(T))return 'ipCredit';
  return 'ipBoth';}
 if(T.includes('ميزان المراجعة'))return 'tb';
 if(T.includes('الميزانية العمومية'))return 'bs';
 if(T.includes('دفتر اليومية'))return 'dj';
 if(has('وارد نقدي'))return 'fin';
 if(has('قيمة المبيع')&&has('الربح'))return 'ip';
 if(has('حسم الفاتورة')&&!has('مجموع الفاتورة'))return 'disc';
 if(has('رقم السند')&&has('مدين')){
  const ai=ci(H,['اسم الحساب']);
  const names=t.data.slice(0,400).map(r=>String(r[ai]??'')).join('|');
  if(names.includes('تكلفة البضاعة')||names.includes('المخزون')||names.includes('صندوق الكاشير'))return 'journal';
  return T.includes('الحركة المالية')?'journal':'cust';}
 if(has('الموضوع')&&has('نسبة'))return 'rat';
 if(has('المبلغ')){
  const f=t.data[0]?String(t.data[0][1]??''):'';
  if(f.includes('صافي'))return 'sum';
  return 'inc';}
 if(has('مدين')&&has('الحساب')){
  const j=t.data.map(r=>String(r[0])).join('|');
  return (j.includes('41101')||j.includes('الموارد'))?'mut':'pl';}
 if(has('التاريخ')&&has('القيمة'))return 'sales';
 return null;}

let R={};

function ingestBuffer(buf,label){try{
 ACTIVE=label||'';
 const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
 R={};
 for(const n of wb.SheetNames){
  const g=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null});
  for(const [s,e2] of colBlocks(g)){
   const t=blockTable(g,s,e2);if(!t||!t.data.length)continue;
   const key=classify(t);if(!key)continue;
   if(key==='cust')R.custName=(t.title||'').replace('كشف حساب','').replace(/[-–]/,'').trim();
   R[key]=t;
  }
 }
 if(R.inc){const m={};R.inc.data.forEach(x=>{m[String(x[1]).trim()]=num(x[2]);});R.m=m;}
 const names={sales:'المبيعات',fin:'الحركة المالية',inc:'قائمة الدخل',sum:'صافي الدخل',rat:'النسب',
  cust:'كشف الحساب',disc:'الحسم',mut:'المتاجره',pl:'أرباح/خسائر',journal:'اليومية',
  ipCash:'ارباح نقدي',ipCredit:'ارباح أجل',ipBoth:'ارباح نقدي+أجل',ip:'ارباح تفصيلي',
  tb:'ميزان المراجعة',bs:'الميزانية',dj:'دفتر اليومية'};
 document.getElementById('pm').innerHTML='✅ '+VERSION+' استخراج: '
  +Object.keys(names).filter(k=>R[k]).map(k=>names[k]).join(' + ');
 render();
}catch(err){showErr('فشل: '+err.message);}}

document.getElementById('fMonthly').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=ev=>ingestBuffer(ev.target.result,f.name.replace(/\.(xlsx|xls)$/i,''));
 rd.readAsArrayBuffer(f);});

/* ===== الحسم ===== */
function discParse(mode){
 const t=R.disc;if(!t)return{total:0,byType:{},invoices:0};
 const H=t.headers;
 const ii=ci(H,['حسم الفاتورة']),vi=ci(H,['قيمة الحسم']);
 const mi=ci(H,['مدين']),cri=ci(H,['دائن']);
 const ti=ci(H,['نوع']),di=ci(H,['تاريخ']),fi=ci(H,['رقم الفاتورة']);
 let total=0,invoices=0;const byType={};
 t.data.forEach(r=>{
  const ty=ti>=0?String(r[ti]):'';
  if(mode==='earn'&&!ty.includes('شراء'))return;
  if(mode==='grant'&&ty.includes('شراء'))return;
  if(di>=0&&P.start){const dt=toDate(r[di]);if(!inP(dt))return;}
  let d=(ii>=0||vi>=0)?(num(r[ii])||0)+(num(r[vi])||0)
   :(mode==='grant'?(num(r[mi])||0)-(num(r[cri])||0):(num(r[cri])||0)-(num(r[mi])||0));
  if(!d)return;
  if(ty.includes('مرتجع'))d=-d;
  total+=d;byType[(ty.split('-')[0].trim()||'عام')]=(byType[(ty.split('-')[0].trim()||'عام')]||0)+d;
  if(fi>=0&&r[fi]!=null&&String(r[fi]).trim()!=='')invoices++;});
 return{total,byType,invoices};}
function returnsFromDisc(){
 const t=R.disc;if(!t)return 0;
 const H=t.headers,ti=ci(H,['نوع']),di=ci(H,['تاريخ']);
 let si=ci(H,['اجمالي الفاتورة']);if(si<0)si=ci(H,['مجموع الفاتورة']);
 if(ti<0||si<0)return 0;let v=0;
 t.data.forEach(r=>{if(!String(r[ti]).includes('مرتجع'))return;
  if(di>=0&&P.start&&!inP(toDate(r[di])))return;v+=num(r[si])||0;});
 return v;}

/* ===== المتاجره / أرباح والخسائر ===== */
function mutajVals(){
 if(!R.mut)return null;
 const H=R.mut.headers,ni=ci(H,['مدين']),cri=ci(H,['دائن']),ai=ci(H,['حساب']);
 const get=k=>{let v=null;R.mut.data.forEach(r=>{if(String(r[ai]).includes(k))v=num(r[ni])||num(r[cri])||0;});return v;};
 return{sales:get('41101'),returns:get('41102'),granted:get('41103'),cogs:get('31105'),netSales:get('الموارد')};}
function plVals(){
 if(!R.pl)return null;
 const H=R.pl.headers,ni=ci(H,['مدين']),cri=ci(H,['دائن']),ai=ci(H,['حساب']);
 const expenses=[];let gross=null;
 R.pl.data.forEach(r=>{const n=String(r[ai]);const v=num(r[ni])||num(r[cri])||0;
  if(n.includes('92')||n.includes('المتاجره'))gross=v;
  else if(v)expenses.push([n.replace(/^\s*\d+\s*-\s*/,''),v]);});
 return{expenses,gross};}

/* ===== ارباح الأصناف ===== */
function ipAgg(){
 const cats=[['نقدي فقط',R.ipCash],['أجل فقط',R.ipCredit],['نقدي+أجل',R.ipBoth],['تفصيلي',R.ip]];
 let totSale=0,totCost=0,totProf=0;const per={};
 cats.forEach(([name,t])=>{
  if(!t)return;
  const H=t.headers;
  let si=ci(H,['اجمالي الفاتورة']);if(si<0)si=ci(H,['قيمة المبيع']);
  const ki=ci(H,['تكلفة']),pi=ci(H,['الربح']);
  let sale=0,cost=0,prof=0;
  filtered(t).forEach(r=>{sale+=num(r[si])||0;cost+=num(r[ki])||0;prof+=num(r[pi])||0;});
  per[name]={sale,cost,prof};
  totSale+=sale;totCost+=cost;totProf+=prof;});
 return{sale:totSale,cost:totCost,prof:totProf,per};}

/* ===== ميزان المراجعة / الميزانية ===== */
function tbVals(){
 if(!R.tb)return null;
 const H=R.tb.headers;
 const ri=ci(H,['رمز الحساب']),mi=ci(H,['حركة مدين']),cri=ci(H,['حركة دائن']);
 if(ri<0||mi<0||cri<0)return null;
 let totD=0,totC=0;const acc={};
 R.tb.data.forEach(r=>{
  const d=num(r[mi])||0,c=num(r[cri])||0;totD+=d;totC+=c;
  const code=String(r[ri]).trim();if(code)acc[code]={d,c};});
 const g=pre=>{for(const k in acc)if(codeMatch(k,pre))return acc[k];return null;};
 const sales=g('41101'),rets=g('41102'),gr=g('41103'),cogs=g('31105'),earn=g('31104'),inv=g('112005');
 return{totD,totC,sales:sales?sales.c:null,returns:rets?rets.d:null,granted:gr?gr.d:null,
  cogs:cogs?cogs.d:null,earned:earn?earn.c:null,inv:inv?(inv.d-inv.c):null};}
function bsVals(){
 if(!R.bs)return null;
 const H=R.bs.headers;
 const ai=ci(H,['الحساب']),mi=ci(H,['مدين']),cri=ci(H,['دائن']);
 if(ai<0||mi<0)return null;
 const get=pre=>{let v=null;R.bs.data.forEach(r=>{
  const m=String(r[ai]).match(/(\d+)\s*$/);if(!m)return;
  if(codeMatch(m[1],pre))v={d:num(r[mi])||0,c:num(r[cri])||0};});return v;};
 const sales=get('41101'),gr=get('41103'),cogs=get('31105');
 return{sales:sales?sales.c:null,granted:gr?gr.d:null,cogs:cogs?cogs.d:null};}

/* ===== ✅ v9 محرك الحسابات بالمطابقة المرنة متعددة المصادر ===== */
function acctSums(t){
 const out={sales:0,ret:0,granted:0,earned:0,cogs:0,expMap:{},rows:0};
 if(!t)return out;
 const H=t.headers;
 const codeI=ci(H,['رمز الحساب']);
 const n1=ci(H,['اسم الحساب']),n2=ci(H,['الحساب']);
 const mi=ci(H,['مدين']),cri=ci(H,['دائن']),di=ci(H,['تاريخ']);
 if(mi<0||cri<0)return out;
 t.data.forEach(r=>{
  if(di>=0&&!inP(toDate(r[di])))return;
  const code=String(codeI>=0?r[codeI]:'').trim();
  const nm=(n1>=0?String(r[n1]??''):'')+'|'+(n2>=0?String(r[n2]??''):'');
  const d=num(r[mi])||0,c=num(r[cri])||0;
  if(!d&&!c)return;
  out.rows++;
  const has=p=>(code&&code.startsWith(p))||nm.includes('- '+p)||nm.includes(p+' -')||nm.includes('|'+p)||nm.includes(p+'|');
  if(has('41102')||nm.includes('مردودات')){out.ret+=d-c;return;}
  if(has('41103')||nm.includes('الحسم الممنوح')){out.granted+=d-c;return;}
  if(has('41104')||nm.includes('الحسم المكتسب')){out.earned+=c-d;return;}
  if(has('31105')||nm.includes('تكلفة البضاعة')){out.cogs+=d-c;return;}
  if(has('41101')||nm.includes('المبيعات')){out.sales+=c-d;return;}
  if(code.startsWith('322')||nm.includes('322')){
   const clean=String(n1>=0?r[n1]??'':code).replace(/\s*-\s*\d+.*$/,'').trim()||code;
   out.expMap[clean]=(out.expMap[clean]||0)+(d-c);}
 });
 out.expList=Object.entries(out.expMap);
 out.exp=out.expList.reduce((s,x)=>s+x[1],0);
 return out;}
function periodEngine(){
 const A=acctSums(R.dj),B=acctSums(R.journal);
 const pick=k=>A[k]?A[k]:(B[k]?B[k]:0);
 const src=A.rows>=B.rows?A:B;
 return{sales:pick('sales'),ret:pick('ret'),granted:pick('granted'),earned:pick('earned'),
  cogs:pick('cogs'),exp:src.exp,expList:src.expList||[],
  jSales:A.sales||B.sales,jGranted:A.granted||B.granted,jCogs:A.cogs||B.cogs};}

function finPeriod(){
 const src=R.dj||R.journal;if(!src)return null;
 const H=src.headers,ti=ci(H,['نوع']),mi=ci(H,['مدين']),cri=ci(H,['دائن']),di=ci(H,['تاريخ']);
 if(ti<0)return null;
 const map={};
 src.data.forEach(r=>{
  if(di>=0&&!inP(toDate(r[di])))return;
  const k=String(r[ti]).split('-')[0].trim()||'عام';
  const m=map[k]||(map[k]={d:0,c:0});
  m.d+=num(r[mi])||0;m.c+=num(r[cri])||0;});
 return Object.entries(map).map(([k,v])=>({k,d:v.d,c:v.c,net:v.d-v.c})).sort((a,b)=>Math.abs(b.net)-Math.abs(a.net));}

/* ===== قائمة الدخل ===== */
function computeIncome(){
 if(P.start){
  const E=periodEngine();const ip=ipAgg();
  const sales=salesTotal()||E.sales;
  const granted=discParse('grant').total||E.granted;
  const earned=discParse('earn').total||E.earned;
  const ret=E.ret||returnsFromDisc();
  const cogs=E.cogs||ip.cost;
  const exp=E.exp;
  const netSales=sales-ret-granted,costSales=cogs,gross=netSales-costSales,net=gross-exp;
  return{sales,ret,granted,earned,cogs,exp,netSales,costSales,gross,net,
   expList:E.expList,filtered:true,chkSales:E.jSales,chkGranted:E.jGranted,chkCogs:E.jCogs};
 }
 const mt=mutajVals()||{},m=R.m||{},pl=plVals();
 const sales=mt.sales??m['المبيعات']??0;
 const ret=mt.returns??m['مردودات المبيعات']??0;
 const cogs=mt.cogs??m['تكلفة البضاعة المباعة']??0;
 const granted=R.disc?discParse('grant').total:(m['الحسم الممنوح']||0);
 const earned=R.disc?discParse('earn').total:(m['الحسم المكتسب']||0);
 const exp=pl?pl.expenses.reduce((s,x)=>s+x[1],0):(m['مجموع المصاريف']||0);
 const netSales=sales-ret-granted,costSales=cogs,gross=netSales-costSales,net=gross-exp;
 return{sales,ret,granted,earned,cogs,exp,netSales,costSales,gross,net,
  mtGranted:mt.granted,mtNet:mt.netSales,plGross:pl?pl.gross:null,filtered:false};}

/* ===== الفترة أدوات ===== */
function maxDate(){let mx=null;
 const scan=t=>{if(!t)return;const d=ci(t.headers,['تاريخ']);if(d<0)return;
  t.data.forEach(r=>{const dt=toDate(r[d]);if(dt&&(!mx||dt>mx))mx=dt;});};
 scan(R.sales);scan(R.cust);scan(R.disc);scan(R.journal);scan(R.dj);scan(R.ipCash);scan(R.ipCredit);scan(R.ipBoth);return mx;}
function inP(d){if(!P.start||!P.end)return true;return d&&d>=P.start&&d<=P.end;}
function filtered(t){if(!t)return[];const d=ci(t.headers,['تاريخ']);if(d<0)return t.data;
 return t.data.filter(r=>inP(toDate(r[d])));}
function salesTotal(){if(!R.sales)return null;const v=ci(R.sales.headers,['قيمة','مبلغ']);
 return filtered(R.sales).reduce((s,r)=>s+(num(r[v])||0),0);}

const chk=(a,b)=>(a!=null&&b!=null)?(Math.abs(a-b)<1?' ✅':' ❌ ('+fmt(b)+')'):'';
const chk2=(a,b)=>{if(a==null||b==null)return '—';
 if(Math.abs(a-b)<1)return ' ✅';
 if(a===0||b===0)return '—';
 return ' ❌ ('+fmt(b)+')';};

 if(ip.prof||ip.sale){

 else if(R.fin){const H=R.fin.headers;const ks=['وارد نقدي','وارد أجل','صادر نقدي','صادر أجل','الرصيد'];

 if(R.cust){const H=R.cust.headers,md=ci(H,['مدين']),cr=ci(H,['دائن']);
  const rows=filtered(R.cust);let d=0,c=0;rows.forEach(r=>{d+=num(r[md])||0;c+=num(r[cr])||0;});
  h+=`<div class="card"><h2>👤 كشف حساب — ${R.custName||''}</h2>`

 h+='</div>';o.innerHTML=h;

 document.getElementById('mbody').innerHTML=`<div class="incwrap"><div>${t1}</div><div>${t2}</div></div>`;
