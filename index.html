<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام شركة الأصباغ</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--acc:#38bdf8;--ok:#4ade80;--bad:#f87171;--txt:#e2e8f0}
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Tahoma}
body{background:var(--bg);color:var(--txt);margin:0;padding:14px}
h1{font-size:19px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border-radius:14px;padding:14px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--acc)}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #334155;font-size:13px}
.row b{direction:ltr}
.btn{display:block;width:100%;margin-top:10px;background:var(--acc);border:0;color:#0f172a;font-weight:700;padding:9px;border-radius:10px;font-size:13px}
.btn.w{background:#f59e0b}.btn.g{background:var(--ok)}.btn.r{background:var(--bad);color:#fff}
.ok{color:var(--ok)}.bad{color:var(--bad)}
input[type=file]{color:var(--txt);font-size:12px;width:100%}
input[type=date]{background:#334155;border:0;color:var(--txt);border-radius:8px;padding:7px}
.pb{background:#334155;border:0;color:var(--txt);border-radius:8px;padding:8px 12px;margin:3px;font-weight:700}
.pb.on{background:var(--acc);color:#0f172a}
.hero{background:linear-gradient(135deg,#0ea5e9,#22c55e);border-radius:14px;padding:16px;text-align:center;margin:12px 0}
.hero b{font-size:24px;display:block}
#modal{position:fixed;inset:0;background:#000c;display:none;padding:12px;overflow:auto;z-index:9}
#modal .box{background:var(--card);border-radius:14px;padding:12px;max-width:1100px;margin:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{border:1px solid #334155;padding:5px;text-align:right;white-space:nowrap}
th{background:#334155}
.x{float:left;background:var(--bad);border:0;border-radius:8px;padding:6px 12px;color:#fff;font-weight:700}
#err{background:#7f1d1d;border-radius:10px;padding:10px;margin:10px 0;display:none}
.tag{font-size:11px;color:#94a3b8}
section{margin:14px 0}
.incwrap{display:flex;gap:14px;flex-wrap:wrap}
.incwrap>div:first-child{flex:2;min-width:300px}
.incwrap>div:last-child{flex:1;min-width:250px}
.r-y{background:#78350f55}.r-b{background:#1e40af44}.r-g{background:#14532d66}.r-p{background:#7f1d1d55}
</style>
</head>
<body>
<h1>🎨 نظام شركة الأصباغ — قراءة عميقة</h1>

<section class="card">
<h2>🗓️ الفترة</h2>
<button class="pb on" onclick="setPeriod('all',this)">الكل</button>
<button class="pb" onclick="setPeriod('day',this)">يوم</button>
<button class="pb" onclick="setPeriod('week',this)">أسبوع</button>
<button class="pb" onclick="setPeriod('month',this)">شهر</button>
من: <input type="date" id="d1" onchange="manualPeriod()">
إلى: <input type="date" id="d2" onchange="manualPeriod()">
<span id="plabel" class="tag"></span>
</section>

<section class="card">
<h2>📄 رفع التقرير الشهري (ملف واحد — كل الأوراق)</h2>
<input type="file" id="fMonthly" accept=".xlsx,.xls">
<div id="pm" class="tag"></div>
</section>

<div id="err"></div>
<div id="out"></div>

<div id="modal"><div class="box">
<button class="x" onclick="closeM()">✕ إغلاق</button>
<h2 id="mtitle"></h2>
<div id="mbody" style="overflow:auto;max-height:78vh"></div>
</div></div>

<script>
/* ===== أدوات ===== */
const num=v=>{if(typeof v==='number')return v;if(v==null)return null;
 const s=String(v).replace(/[,\s]/g,'');const n=parseFloat(s);return isNaN(n)?null:n;};
const fmt=n=>n==null?'—':n.toLocaleString('en-US',{maximumFractionDigits:2});
const pct=n=>n==null?'—':(n*100).toFixed(1)+'%';
function toDate(v){if(v==null)return null;if(v instanceof Date)return v;
 if(typeof v==='number'&&v>20000&&v<80000)return new Date(Math.round((v-25569)*86400000));
 const s=String(v).trim();let m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
 if(m)return new Date(+m[1],+m[2]-1,+m[3]);
 m=s.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);
 const d=new Date(s);return isNaN(d)?null:d;}
const ci=(H,ks)=>H.findIndex(h=>ks.some(k=>String(h).includes(k)));

/* ===== محرك القراءة العميقة ===== */
const IDX=['#','ت'];
const COLK=['النوع','التاريخ','القيمة','اسم الحساب','مدين','دائن','وارد نقدي','وارد أجل','صادر نقدي','صادر أجل','رقم السند','المبلغ','البيان','الرصيد','الموضوع','نسبة','حسم','الكمية','الوحدة','المادة','رقم الفاتورة','الحساب','تكلفة','الربح','قيمة المبيع','السعر الاجمالي','السعر النهائي','اسم العميل'];
function colBlocks(g){
 const W=g.reduce((m,r)=>Math.max(m,r.length),0);
 const act=new Array(W).fill(false);
 for(const r of g)for(let c=0;c<W;c++)if(r[c]!=null&&String(r[c]).trim()!=='')act[c]=true;
 const res=[];let s=-1;
 for(let c=0;c<=W;c++){
  if(c<W&&act[c]){if(s<0)s=c;}
  else if(s>=0){if(c-s>=2)res.push([s,c]);s=-1;}
 }
 return res;}
function blockTable(g,s,e){
 let h=-1,cols=[];
 for(let i=0;i<Math.min(g.length,60);i++){
  let kw=0,idx=false;
  for(let c=s;c<e;c++){const v=g[i][c];if(v==null)continue;const t=String(v).trim();
   if(IDX.includes(t))idx=true;if(COLK.some(k=>t.includes(k)))kw++;}
  if(kw>=2||(idx&&kw>=1)){h=i;for(let c=s;c<e;c++)if(g[i][c]!=null&&String(g[i][c]).trim()!=='')cols.push(c);break;}
 }
 if(h<0)return null;
 const headers=cols.map(c=>String(g[h][c]).trim());
 const TK=['كشف حساب','حركة المبيعات','الحركة المالية','قائمة الدخل','صافي الدخل','نسب الأرباح','حسم ممنوح','متاجره','الخسائر','ارباح المواد'];
 let title='';
 for(let i=0;i<h&&!title;i++)for(let c=s;c<e;c++){const v=g[i][c];
  if(v!=null&&TK.some(k=>String(v).includes(k))){title=String(v);break;}}
 const data=[];let totals=null,blank=0;
 for(let i=h+1;i<g.length;i++){
  const row=g[i]||[];const vals=cols.map(c=>row[c]??null);
  if(vals.every(v=>v==null||String(v).trim()==='')){blank++;if(blank>=2)break;continue;}
  blank=0;
  if(vals.some(v=>v!=null&&String(v).includes('مجموع'))){totals=vals;break;}
  data.push(vals);}
 return{headers,data,totals,title};}
function classify(t){
 const H=t.headers;const has=k=>H.some(h=>String(h).includes(k));const T=t.title||'';
 if(has('وارد نقدي'))return 'fin';
 if(has('قيمة المبيع')&&has('الربح'))return 'ip';
 if(has('حسم الفاتورة'))return 'disc';
 if(has('رقم السند')&&has('مدين'))return T.includes('الحركة المالية')?'journal':'cust';
 if(has('الموضوع')&&has('نسبة'))return 'rat';
 if(has('المبلغ')){
  const f=t.data[0]?String(t.data[0][1]??''):'';
  if(f.includes('صافي'))return 'sum';
  return 'inc';}
 if(has('مدين')&&has('الحساب')){
  const j=t.data.map(r=>String(r[0])).join('|');
  return (j.includes('41101')||j.includes('الموارد'))?'mut':'pl';}
 if(has('التاريخ')&&has('القيمة'))return 'sales';
 return null;}

let R={};let P={start:null,end:null};

document.getElementById('fMonthly').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=ev=>{try{
  const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
  R={};
  for(const n of wb.SheetNames){
   const g=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null});
   for(const [s,e2] of colBlocks(g)){
    const t=blockTable(g,s,e2);if(!t||!t.data.length)continue;
    const key=classify(t);if(!key)continue;
    if(key==='cust')R.custName=(t.title||'').replace('كشف حساب','').replace(/[-–]/,'').trim();
    R[key]=t;
   }
  }
  if(R.inc){const m={};R.inc.data.forEach(x=>{m[String(x[1]).trim()]=num(x[2]);});R.m=m;}
  const names={sales:'المبيعات',fin:'الحركة المالية',inc:'قائمة الدخل',sum:'صافي الدخل',rat:'النسب',
   cust:'كشف الحساب',disc:'الحسم',mut:'المتاجره',pl:'أرباح/خسائر',ip:'ارباح المواد',journal:'الحركة التفصيلية'};
  document.getElementById('pm').innerHTML='✅ تم استخراج: '
   +Object.keys(names).filter(k=>R[k]).map(k=>names[k]).join(' + ')
   +(R.sales?` — <b>${R.sales.data.length} يوم مبيعات</b>`:'');
  render();
 }catch(err){showErr('فشل: '+err.message);}};
 rd.readAsArrayBuffer(f);
});

/* ===== الحسم ===== */
function discParse(mode){
 const t=R.disc;if(!t)return{total:0,byType:{},invoices:0};
 const H=t.headers;
 const ii=ci(H,['حسم الفاتورة']),vi=ci(H,['قيمة الحسم']);
 const mi=ci(H,['مدين']),cri=ci(H,['دائن']);
 const ti=ci(H,['نوع']),di=ci(H,['تاريخ']),fi=ci(H,['رقم الفاتورة']);
 let total=0,invoices=0;const byType={};
 t.data.forEach(r=>{
  const ty=ti>=0?String(r[ti]):'';
  if(mode==='earn'&&!ty.includes('شراء'))return;
  if(mode==='grant'&&ty.includes('شراء'))return;
  if(di>=0&&P.start){const dt=toDate(r[di]);if(!inP(dt))return;}
  let d=(ii>=0||vi>=0)?(num(r[ii])||0)+(num(r[vi])||0)
   :(mode==='grant'?(num(r[mi])||0)-(num(r[cri])||0):(num(r[cri])||0)-(num(r[mi])||0));
  if(!d)return;
  if(ty.includes('مرتجع'))d=-d;
  total+=d;byType[(ty.split('-')[0].trim()||'عام')]=(byType[(ty.split('-')[0].trim()||'عام')]||0)+d;
  if(fi>=0&&r[fi]!=null&&String(r[fi]).trim()!=='')invoices++;});
 return{total,byType,invoices};}

/* ===== المتاجره / أرباح والخسائر ===== */
function mutajVals(){
 if(!R.mut)return null;
 const H=R.mut.headers,ni=ci(H,['مدين']),cri=ci(H,['دائن']),ai=ci(H,['حساب']);
 const get=k=>{let v=null;R.mut.data.forEach(r=>{if(String(r[ai]).includes(k))v=num(r[ni])||num(r[cri])||0;});return v;};
 return{sales:get('41101'),returns:get('41102'),granted:get('41103'),cogs:get('31105'),netSales:get('الموارد')};}
function plVals(){
 if(!R.pl)return null;
 const H=R.pl.headers,ni=ci(H,['مدين']),cri=ci(H,['دائن']),ai=ci(H,['حساب']);
 const expenses=[];let gross=null;
 R.pl.data.forEach(r=>{const n=String(r[ai]);const v=num(r[ni])||num(r[cri])||0;
  if(n.includes('92')||n.includes('المتاجره'))gross=v;
  else if(v)expenses.push([n.replace(/^\s*\d+\s*-\s*/,''),v]);});
 return{expenses,gross};}

/* ===== ✅ ارباح المواد — مع استبعاد أسطر الأجل ===== */
function ipVals(){
 if(!R.ip)return null;
 const H=R.ip.headers,si=ci(H,['قيمة المبيع']),ki=ci(H,['تكلفة']),pi=ci(H,['الربح']);
 let sale=0,cost=0,prof=0,skipped=0,kept=0;
 R.ip.data.forEach(r=>{
  const line=r.map(v=>v==null?'':String(v)).join('|');
  if(/أجل|اجل/.test(line)){skipped++;return;}
  kept++;sale+=num(r[si])||0;cost+=num(r[ki])||0;prof+=num(r[pi])||0;});
 return{sale,cost,prof,skipped,kept};}

/* ===== قائمة الدخل ===== */
function computeIncome(){
 const mt=mutajVals()||{},m=R.m||{},pl=plVals();
 const sales=mt.sales??m['المبيعات']??0;
 const ret=mt.returns??m['مردودات المبيعات']??0;
 const cogs=mt.cogs??m['تكلفة البضاعة المباعة']??0;
 const granted=R.disc?discParse('grant').total:(m['الحسم الممنوح']||0);
 const earned=R.disc?discParse('earn').total:(m['الحسم المكتسب']||0);
 const exp=pl?pl.expenses.reduce((s,x)=>s+x[1],0):(m['مجموع المصاريف']||0);
 const netSales=sales-ret-granted,costSales=cogs-earned,gross=netSales-costSales,net=gross-exp;
 return{sales,ret,granted,earned,cogs,exp,netSales,costSales,gross,net,
  mtGranted:mt.granted,mtNet:mt.netSales,plGross:pl?pl.gross:null};}

/* ===== الفترة ===== */
function maxDate(){let mx=null;
 const scan=t=>{if(!t)return;const d=ci(t.headers,['تاريخ']);if(d<0)return;
  t.data.forEach(r=>{const dt=toDate(r[d]);if(dt&&(!mx||dt>mx))mx=dt;});};
 scan(R.sales);scan(R.cust);scan(R.disc);scan(R.journal);return mx;}
function setPeriod(k,b){document.querySelectorAll('.pb').forEach(x=>x.classList.remove('on'));
 if(b)b.classList.add('on');const mx=maxDate();
 if(k==='all'||!mx)P={start:null,end:null};
 else if(k==='day')P={start:new Date(mx.getFullYear(),mx.getMonth(),mx.getDate()),end:mx};
 else if(k==='week'){const s=new Date(mx);s.setDate(s.getDate()-6);P={start:s,end:mx};}
 else P={start:new Date(mx.getFullYear(),mx.getMonth(),1),end:new Date(mx.getFullYear(),mx.getMonth()+1,0)};
 syncDates();render();}
function manualPeriod(){P={start:toDate(document.getElementById('d1').value),end:toDate(document.getElementById('d2').value)};render();}
function syncDates(){const f=d=>d?d.toISOString().slice(0,10):'';
 document.getElementById('d1').value=f(P.start);document.getElementById('d2').value=f(P.end);}
function inP(d){if(!P.start||!P.end)return true;return d&&d>=P.start&&d<=P.end;}
function periodLabel(){return P.start?`الفترة: ${P.start.toLocaleDateString('en-GB')} → ${P.end.toLocaleDateString('en-GB')}`:'الفترة: كل الحركات';}
function filtered(t){const d=ci(t.headers,['تاريخ']);if(d<0)return t.data;
 return t.data.filter(r=>inP(toDate(r[d])));}
function salesTotal(){if(!R.sales)return null;const v=ci(R.sales.headers,['قيمة','مبلغ']);
 return filtered(R.sales).reduce((s,r)=>s+(num(r[v])||0),0);}

/* ===== العرض ===== */
const row=(l,v,c)=>`<div class="row"><span>${l}</span><b class="${c||''}">${v}</b></div>`;
function showErr(m){const e=document.getElementById('err');e.style.display='block';e.innerHTML=m;}
const chk=(a,b)=>(a!=null&&b!=null)?(Math.abs(a-b)<1?' ✅':' ❌ ('+fmt(b)+')'):'';

function render(){
 const o=document.getElementById('out');const ic=computeIncome();
 let h=`<p class="tag" style="text-align:center">${periodLabel()}</p>`;
 h+=`<div class="hero">صافي الربح<b>${fmt(ic.net)} دينار</b><small>مجمل ${pct(ic.gross/(ic.netSales||1))} — صافي ${pct(ic.net/(ic.netSales||1))}</small></div>`;
 h+='<div class="grid">';

 h+=`<div class="card"><h2>📊 قائمة الدخل</h2>`
  +row('المبيعات',fmt(ic.sales))+row('الحسم الممنوح',fmt(ic.granted),'bad')
  +row('الحسم المكتسب',fmt(ic.earned),'ok')+row('صافي المبيعات',fmt(ic.netSales))
  +row('تكلفة المبيعات',fmt(ic.costSales))+row('مجمل الدخل',fmt(ic.gross))
  +row('مجموع المصاريف',fmt(ic.exp),'bad')+row('صافي الربح',fmt(ic.net),'ok')
  +`<button class="btn" onclick="openIncome()">الترتيب الكامل + التحقق</button></div>`;

 const gp=discParse('grant'),ep=discParse('earn');
 h+=`<div class="card"><h2>🎁 الحسم الممنوح والمكتسب</h2>`
  +row('الممنوح',fmt(gp.total)+' د.ع','bad')+row('المكتسب',fmt(ep.total)+' د.ع','ok')
  +row('مطابقة 41103',chk(gp.total,ic.mtGranted))
  +`<button class="btn r" onclick="openDisc('grant')">تفاصيل الممنوح</button>
     <button class="btn g" onclick="openDisc('earn')">تفاصيل المكتسب</button></div>`;

 if(R.sales)h+=`<div class="card"><h2>📈 حركة المبيعات</h2>`
  +row('المجموع',fmt(salesTotal())+' د.ع')+row('عدد الأيام',filtered(R.sales).length)
  +`<button class="btn" onclick="openT('حركة المبيعات',R.sales)">التفاصيل</button></div>`;

 if(R.fin){const H=R.fin.headers;const ks=['وارد نقدي','وارد أجل','صادر نقدي','صادر أجل','الرصيد'];
  const s=ks.map(k=>{const i=ci(H,[k]);return R.fin.data.reduce((a,r)=>a+(num(r[i])||0),0);});
  h+=`<div class="card"><h2>💰 اجمالي الحركة المالية</h2>`
  +row('وارد نقدي',fmt(s[0]))+row('وارد أجل',fmt(s[1]))+row('صادر نقدي',fmt(s[2]),'bad')
  +row('صادر أجل',fmt(s[3]),'bad')+row('الرصيد',fmt(s[4]),s[4]>=0?'ok':'bad')
  +`<button class="btn" onclick="openT('اجمالي الحركة المالية',R.fin)">التفاصيل</button></div>`;}

 const ip=ipVals();
 if(ip)h+=`<div class="card"><h2>🧾 ارباح المواد (ورقة٣)</h2>`
  +row('قيمة المبيع (نقدي فقط)',fmt(ip.sale))+row('التكلفة',fmt(ip.cost),'bad')
  +row('الربح',fmt(ip.prof),'ok')
  +row('أسطر الأجل المستبعدة',ip.skipped,'bad')
  +row('مطابقة المجمل',chk(ip.prof,ic.gross))
  +`<button class="btn" onclick="openT('ارباح المواد',R.ip)">التفاصيل</button></div>`;

 if(R.journal)h+=`<div class="card"><h2>📒 الحركة المالية التفصيلية</h2>`
  +row('عدد الحركات',filtered(R.journal).length)
  +`<button class="btn" onclick="openT('الحركة المالية',R.journal)">عرض</button></div>`;

 if(R.cust){const H=R.cust.headers,md=ci(H,['مدين']),cr=ci(H,['دائن']);
  const rows=filtered(R.cust);let d=0,c=0;rows.forEach(r=>{d+=num(r[md])||0;c+=num(r[cr])||0;});
  h+=`<div class="card"><h2>👤 كشف حساب — ${R.custName||''}</h2>`
  +row('مدين',fmt(d)+' د.ع')+row('دائن',fmt(c)+' د.ع')+row('الرصيد',fmt(d-c)+' د.ع',d-c>=0?'ok':'bad')
  +`<button class="btn" onclick="openT('كشف الحساب',R.cust)">التفاصيل (${rows.length})</button></div>`;}

 h+='</div>';o.innerHTML=h;
 document.getElementById('plabel').textContent=periodLabel();
}

/* ===== النوافذ ===== */
function closeM(){document.getElementById('modal').style.display='none';}
function openIncome(){
 const ic=computeIncome();const pl=plVals();const ip=ipVals();
 document.getElementById('mtitle').textContent='قائمة الدخل + التحقق المتقاطع';
 const exps=pl?pl.expenses:[];
 const main=[['المبيعات',ic.sales,''],['مردودات المبيعات',ic.ret,''],['الحسم الممنوح',ic.granted,'r-p'],
  ['صافي المبيعات',ic.netSales,'r-y'],['الحسم المكتسب',ic.earned,'r-g'],
  ['تكلفة البضاعة المباعة',ic.cogs,''],['تكلفة المبيعات',ic.costSales,'r-b'],
  ['مجمل الدخل',ic.gross,'r-g'],['إيرادات مختلفة',0,''],
  ...exps.map(x=>[x[0],x[1],'']),['مجموع المصاريف',ic.exp,'r-p']];
 let t1='<table><tr><th>ت</th><th>اسم الحساب</th><th>المبلغ</th></tr>';
 main.forEach((r,i)=>t1+=`<tr class="${r[2]}"><td>${i+1}</td><td>${r[0]}</td><td>${fmt(r[1])}</td></tr>`);
 t1+='</table>';
 let t2=`<table><tr><th colspan="3" style="background:#0ea5e9">صافي الدخل</th></tr>
  <tr><td>1</td><td>صافي المبيعات</td><td>${fmt(ic.netSales)}</td></tr>
  <tr><td>2</td><td>تكلفة المبيعات</td><td>${fmt(ic.costSales)}</td></tr>
  <tr><td>3</td><td>مجمل الدخل</td><td>${fmt(ic.gross)}</td></tr>
  <tr><td>4</td><td>مجموع المصاريف</td><td>${fmt(ic.exp)}</td></tr>
  <tr class="r-g"><td>5</td><td>صافي الربح</td><td><b>${fmt(ic.net)}</b></td></tr></table><br>
  <table><tr><th colspan="3" style="background:#0ea5e9">نسب الأرباح</th></tr>
  <tr><td>1</td><td>نسبة مجمل الدخل على صافي المبيعات</td><td>${pct(ic.gross/(ic.netSales||1))}</td></tr>
  <tr><td>2</td><td>نسبة الربح على صافي المبيعات</td><td>${pct(ic.net/(ic.netSales||1))}</td></tr></table><br>
  <table><tr><th colspan="2" style="background:#f59e0b">🔍 التحقق المتقاطع</th></tr>
  <tr><td>الممنوح = 41103</td><td>${chk(discParse('grant').total,ic.mtGranted)||'—'}</td></tr>
  <tr><td>صافي المبيعات = الموارد</td><td>${chk(ic.netSales,ic.mtNet)||'—'}</td></tr>
  <tr><td>المجمل = أرباح/خسائر 92</td><td>${chk(ic.gross,ic.plGross)||'—'}</td></tr>
  <tr><td>المجمل = ارباح المواد (بدون أجل)</td><td>${chk(ic.gross,ip?ip.prof:null)||'—'}</td></tr></table>`;
 document.getElementById('mbody').innerHTML=`<div class="incwrap"><div>${t1}</div><div>${t2}</div></div>`;
 document.getElementById('modal').style.display='block';}
function openDisc(mode){
 const a=discParse(mode);
 document.getElementById('mtitle').textContent=mode==='grant'?'تفاصيل الحسم الممنوح':'تفاصيل الحسم المكتسب';
 let x='<table><tr><th>النوع</th><th>الحسم</th></tr>';
 Object.entries(a.byType).forEach(([k,v])=>x+=`<tr><td>${k}</td><td>${fmt(v)}</td></tr>`);
 x+=`<tr><td><b>الكلي</b></td><td><b>${fmt(a.total)} د.ع</b></td></tr></table>`;
 if(R.disc){x+='<br><table><tr>'+R.disc.headers.map(v=>`<th>${v}</th>`).join('')+'</tr>';
  R.disc.data.slice(0,800).forEach(r=>x+='<tr>'+r.map(v=>`<td>${typeof v==='number'?fmt(v):(v??'')}</td>`).join('')+'</tr>');
  x+='</table>';}
 document.getElementById('mbody').innerHTML=x;
 document.getElementById('modal').style.display='block';}
function openT(t,tbl){
 document.getElementById('mtitle').textContent=t+' ('+tbl.data.length+' سطر)';
 let x='<table><tr>'+tbl.headers.map(v=>`<th>${v}</th>`).join('')+'</tr>';
 tbl.data.forEach(r=>x+='<tr>'+r.map(v=>`<td>${typeof v==='number'?fmt(v):(v??'')}</td>`).join('')+'</tr>');
 if(tbl.totals)x+='<tr>'+tbl.totals.map(v=>`<td><b>${typeof v==='number'?fmt(v):(v??'')}</b></td>`).join('')+'</tr>';
 document.getElementById('mbody').innerHTML=x+'</table>';
 document.getElementById('modal').style.display='block';}
</script>
</body>
</html>
